name: PR check and AI review
on:
  workflow_dispatch:
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    - closed
  pull_request_review_comment:
    types:
    - created
run-name: "${{ github.event_name == 'workflow_dispatch' && 'Unit testing only' ||
  format('Pull Request #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
  }}"
jobs:
  pr_tg_report:
    name: Telegram notification
    if: ${{ github.event_name == 'pull_request' || github.event_name == 
      'pull_request_target' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - name: Send message to Telegram
      id: tg_msg
      uses: appleboy/telegram-action@master
      continue-on-error: true
      with:
        token: ${{ secrets.TELEGRAM_API_TOKEN }}
        to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        debug: true
        format: markdown
        message: "🔔 **Action**: ${{ github.event_name }} ${{ github.event.action }}
          [#${{ github.event.pull_request.number }}](${{ github.event.comment.html_url
          || github.event.pull_request.html_url }})\n\n📁 **Repository**: ${{ github.repository
          }}\n🌿 **Branch**: ${{ github.event.pull_request.head.ref }} -> ${{ github.event.pull_request.base.ref
          }}\n👤 **From user**: ${{ github.actor }}\n\n📌 **Title**: ${{ github.event.pull_request.title
          }}\n💬 **Description**:\n${{ github.event.comment.body || github.event.pull_request.body
          }}\n"
    - name: Send action and title only to Telegram (if error sending 
        description)
      if: failure()
      uses: appleboy/telegram-action@master
      continue-on-error: true
      with:
        token: ${{ secrets.TELEGRAM_API_TOKEN }}
        to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        debug: true
        format: markdown
        message: "🔔 **Action**: ${{ github.event_name }} ${{ github.event.action }}
          [#${{ github.event.pull_request.number }}](${{ github.event.comment.html_url
          || github.event.pull_request.html_url }})\n\n📁 **Repository**: ${{ github.repository
          }}\n🌿 **Branch**: ${{ github.event.pull_request.head.ref }} -> ${{ github.event.pull_request.base.ref
          }}\n👤 **From user**: ${{ github.actor }}\n\n📌 **Title**: ${{ github.event.pull_request.title
          }}\n"
  pr_unit_test:
    name: Unit testing
    if: ${{ ((github.event_name == 'pull_request' || github.event_name == 
      'pull_request_target') && github.event.action == 'opened') || 
      github.event_name == 'workflow_dispatch' }}
    permissions:
      pull-requests: write
      contents: read
      models: read
      checks: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: false
    - name: Validate controlled business fixture
      run: go test ./...
  pr_ai_review:
    name: AI review
    needs:
    - pr_tg_report
    - pr_unit_test
    if: ${{ false }}
    permissions:
      pull-requests: write
      contents: read
      models: read
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository (merge branch and 1 last commits)
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Get PR diff
      id: pr_diff
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "DIFF=$(gh pr diff ${{ github.event.pull_request.number }})\n{\n  echo
        \"diff<<EOF\"\n  echo \"$DIFF\"\n  echo \"EOF\"\n} >> \"$GITHUB_OUTPUT\"\n"
    - name: Generate report using AI
      id: ai_query
      uses: actions/ai-inference@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        endpoint: https://models.github.ai/inference
        model: gpt-4.1
        max-tokens: 2048
        system-prompt: "You are a Pull Request Review Agent on GitHub.\nReview the
          pull request and provide feedback.\nFocus on potential bugs, security issues
          and code style.\nResponses should be brief and written in English.\n"
        prompt: "PR Title: ${{ github.event.pull_request.title }}\nPR Description:\n\
          ${{ github.event.pull_request.body }}\n\nCode diff:\n${{ steps.pr_diff.outputs.diff
          }}\n"
    - name: Post AI comment on PR
      if: ${{ steps.ai_query.outputs.response != '' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        AI_RESPONSE: ${{ steps.ai_query.outputs.response }}
      run: "gh pr comment \"$PR_NUMBER\" --body \"### AI Code Review\n\n$AI_RESPONSE\""
